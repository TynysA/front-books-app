replicaCount: 1

image:
  repository: $IMAGE_FULL_NAME
  pullPolicy: IfNotPresent
  tag: $BUILD_ID

env:
  TZ: "Asia/Aqtau"
  open:
    - name: "NGINX_VERSION"
      value: "1.25.3"

imagePullSecrets:
  - name: myregistrykey

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80 

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-body-size: "1000m"
  hosts:
    - host: dev-webview.ffins.kz
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 0.4
    memory: 512Mi
  limits:
    cpu: 0.5
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

